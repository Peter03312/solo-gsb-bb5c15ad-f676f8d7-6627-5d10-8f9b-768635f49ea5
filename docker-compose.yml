services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coldchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coldchain}
      POSTGRES_DB: ${POSTGRES_DB:-coldchain}
    volumes:
      # 首次启动自动执行初始化 SQL（建表 + 索引）
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅便于本机调试；不需要可注释掉
      - "${POSTGRES_PORT_PUBLISH:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coldchain} -d ${POSTGRES_DB:-coldchain}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coldchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coldchain}
      POSTGRES_DB: ${POSTGRES_DB:-coldchain}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
